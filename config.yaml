# 环境配置
env:
  cuda: 0
  seed: 42
  run_id: "davis_mix_v1"

# 路径配置
paths:
  dataset: "davis"
  data_root: "../data/"
  log_xlsx: "training_noval.xlsx"
  save_dir: "models/"

# 训练超参数
train:
  epochs: 2200
  batch_size: 512
  lr: 0.0002
  pos_threshold: 7.0
  patience: 15          # 早停轮数
  val_interval: 25      # 每隔多少 epoch 验证一次

# 模型架构参数
model:
  tau: 0.8
  lam: 0.5
  edge_dropout: 0.2
  embedding_dim: 128
  # 维度拆解：[输入, 隐藏1, 隐藏2, ...]
  ns_dims: [null, 512, 256]        # 第一个位置会在代码中动态补齐 (num_drug + num_target + 2)
  drug_ms_dims: [78, 78, 156, 256] # 对应原代码 78*2=156
  target_ms_dims: [54, 54, 108, 256] # 对应原代码 54*2=108

  cuda: 0